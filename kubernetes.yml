# Namespace definition
apiVersion: v1
kind: Namespace
metadata:
  name: ghostfolio

---

# Pod definition
apiVersion: v1
kind: Pod
metadata:
  name: ghostfolio-feeder
  namespace: ghostfolio
spec:
  containers:
  - name: ghostfolio-feeder
    image: ghostfolio-feeder  # Docker image name
    imagePullPolicy: Never
    volumeMounts:
    - name: app-data
      mountPath: /app/data
      readOnly: true
    envFrom:
    - configMapRef:
        name: ghostfolio-feeder-env
    - secretRef:
        name: ghostfolio-feeder-secret
  restartPolicy: Always
  volumes:
  - name: app-data
    hostPath:
      path: /path/to/host/app/data  # Host volume path

---

# ConfigMap definition
apiVersion: v1
kind: ConfigMap
metadata:
  name: ghostfolio-feeder-env
  namespace: ghostfolio
data:
  HOST: https://example.com
  CRONTAB: "*/30 * * * *"

---

# Secret definition
apiVersion: v1
kind: Secret
metadata:
  name: ghostfolio-feeder-secret
  namespace: ghostfolio
type: Opaque
stringData:
  ACCESS_TOKEN: your_access_token
